name: event_app
description: "event. — Discover extraordinary experiences and book sample tickets"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  dio: ^5.7.0
  connectivity_plus: ^6.1.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  cached_network_image: ^3.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
